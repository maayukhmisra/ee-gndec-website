global-styling:
  version: VERSION
  js:
    js/global.js: {}
  css:
    component:
      css/style.css: { weight: 100 }
      css/colors.css: { weight: 99 }
bootstrap:
  js:
    /libraries/popper.js/dist/umd/popper.min.js: { weight: -19 }
    /libraries/bootstrap/dist/js/bootstrap.min.js: { weight: -20 }
  css:
    component:
      /libraries/bootstrap/dist/css/bootstrap.min.css: {}
  dependencies:
    - core/popperjs
color.preview:
  version: VERSION
  css:
    theme:
      color/preview.css: {}
  js:
    color/preview.js: {}
  dependencies:
    - color/drupal.color

front-page-styles:
  version: 1.x
  css:
    theme:
      css/style.css: {}

bootstrap-icons:
  version: 1.11.3
  css:
    theme:
      https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css: { type: external }